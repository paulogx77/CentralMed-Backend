version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: centralmed-db
    restart: always
    environment:
      POSTGRES_DB: centralmed_db
      POSTGRES_USER: centralmed_user
      POSTGRES_PASSWORD: centralmed_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - centralmed-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U centralmed_user -d centralmed_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- AQUI ESTÁ O QUE FALTAVA ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: centralmed-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@centralmed.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - centralmed-net
